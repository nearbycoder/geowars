<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Geo Wars: Neon Evolved</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-1.1 -1.1 2.2 2.2'%3E%3Crect x='-1.1' y='-1.1' width='2.2' height='2.2' rx='.4' fill='%23000'/%3E%3Cpath d='M.45-.95L.85.7 0 .3-.85.7-.45-.95-.2-.1H.2Z' fill='none' stroke='%233ef0ff' stroke-width='.16' stroke-linejoin='round'/%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:'Orbitron',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;-webkit-touch-callout:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.hud-top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 16px) 0 calc(env(safe-area-inset-left,0px) + 16px)}
.hud-l{flex:1;display:flex;gap:12px;align-items:flex-start}
.hud-c{flex:1.4;text-align:center}
.hud-r{flex:1;text-align:right}
#pauseBtn{pointer-events:auto;width:40px;height:40px;flex:none;border-radius:10px;border:2px solid rgba(62,240,255,.65);background:rgba(0,12,24,.45);color:#3ef0ff;font:900 13px Orbitron,sans-serif;cursor:pointer;box-shadow:0 0 10px rgba(62,240,255,.4);touch-action:manipulation}
.stack{display:flex;flex-direction:column;gap:6px;padding-top:2px}
.icons{display:flex;gap:4px;height:18px;align-items:center;font-size:14px;font-weight:900}
.icons svg{width:18px;height:18px;filter:drop-shadow(0 0 4px currentColor)}
#lives{color:#fff}
#bombs{color:#3ef0ff}
#score{font-weight:900;font-size:clamp(20px,3.6vw,38px);letter-spacing:.04em;line-height:1.1;text-shadow:0 0 10px rgba(255,255,255,.7),0 0 26px rgba(62,240,255,.6)}
#mult{display:inline-block;font-weight:700;font-size:clamp(14px,2.2vw,22px);color:#d4ff3a;text-shadow:0 0 10px #a6ff2a}
#mult.bump{animation:bump .22s ease-out}
@keyframes bump{0%{transform:scale(1.4)}100%{transform:scale(1)}}
.lbl{font-size:10px;letter-spacing:.22em;color:rgba(255,255,255,.55)}
#best{font-size:clamp(12px,1.8vw,18px);color:#ffe640;text-shadow:0 0 8px #ffb400}
#timer{font-size:clamp(18px,3vw,30px);font-weight:900;color:#ff4fd8;text-shadow:0 0 12px #ff4fd8;margin-top:4px}
#timer.low{animation:blink .5s infinite}
@keyframes blink{50%{opacity:.35}}
#powers{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + clamp(64px,9vw,92px));display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:90vw}
.chip{position:relative;overflow:hidden;font-size:10px;font-weight:700;letter-spacing:.12em;padding:4px 8px 6px;border:1px solid var(--c);color:var(--c);border-radius:6px;background:rgba(0,0,0,.45);box-shadow:0 0 8px var(--c)}
.chip i{position:absolute;left:0;bottom:0;height:2px;background:var(--c);box-shadow:0 0 6px var(--c)}
#zoneHint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);text-align:center;font-size:12px;letter-spacing:.3em;color:#ffe640;text-shadow:0 0 10px #ffb400;animation:blink .8s infinite}

#announce{position:fixed;left:0;right:0;top:28%;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:6}
.ann{animation:ann 2s cubic-bezier(.2,.8,.2,1) forwards;text-align:center}
.ann-t{font-weight:900;font-size:clamp(22px,5vw,52px);letter-spacing:.12em;color:#fff;text-shadow:0 0 8px var(--c),0 0 24px var(--c),0 0 48px var(--c)}
.ann-s{font-size:clamp(11px,1.6vw,15px);letter-spacing:.3em;color:var(--c);margin-top:2px}
@keyframes ann{0%{opacity:0;transform:scale(2);filter:blur(10px)}12%{opacity:1;transform:scale(1);filter:blur(0)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.92) translateY(-16px)}}

/* ---------- Touch controls ---------- */
#touch{position:fixed;inset:0;pointer-events:none;z-index:4;display:none}
body.touch.playing #touch{display:block}
.stick{position:absolute;left:0;top:0;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:2px solid var(--c);
  box-shadow:0 0 16px var(--c),inset 0 0 22px var(--c);opacity:.25;transition:opacity .2s}
.stick.on{opacity:.9;transition:none}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;border:2px solid var(--c);background:radial-gradient(circle,var(--c) 0%,rgba(0,0,0,0) 72%)}
.stick .lab{position:absolute;top:100%;left:-20px;right:-20px;text-align:center;font-size:9px;letter-spacing:.25em;color:var(--c);margin-top:6px}
.stick.on .lab{display:none}
#stickL{--c:#3ef0ff}
#stickR{--c:#ff4fd8}
#bombBtn{position:absolute;pointer-events:auto;right:calc(env(safe-area-inset-right,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 186px);
  width:68px;height:68px;border-radius:50%;border:2px solid #ffe640;color:#ffe640;background:rgba(40,30,0,.35);font:900 10px Orbitron,sans-serif;letter-spacing:.08em;line-height:1.3;
  box-shadow:0 0 14px rgba(255,230,64,.6),inset 0 0 14px rgba(255,230,64,.35);touch-action:none}
#bombBtn:active{background:rgba(255,230,64,.4)}
#bombBtn.empty{opacity:.3}

/* ---------- Screens ---------- */
.screen{position:fixed;inset:0;z-index:10;display:flex;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;
  background:radial-gradient(ellipse at 50% 40%,rgba(10,0,30,.15),rgba(0,0,0,.78) 78%)}
.panel{margin:auto;display:flex;flex-direction:column;align-items:center;gap:18px;width:min(1000px,100%);
  padding:calc(env(safe-area-inset-top,0px) + 22px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 22px) calc(env(safe-area-inset-left,0px) + 16px)}
.title{font-weight:900;font-size:clamp(46px,11vw,124px);line-height:.92;letter-spacing:.06em;text-align:center;color:#fff;
  text-shadow:0 0 6px #fff,0 0 18px #3ef0ff,0 0 42px #3ef0ff,0 0 90px #b46bff;animation:flick 7s infinite}
.title span{color:#fff;text-shadow:0 0 6px #fff,0 0 18px #ff4fd8,0 0 42px #ff4fd8,0 0 90px #ff4fd8}
@keyframes flick{0%,91%,95%,100%{opacity:1}92%,94%{opacity:.55}}
.sub{letter-spacing:.6em;font-size:clamp(11px,1.8vw,16px);color:#ffe640;text-shadow:0 0 10px #ffb400;text-align:center;padding-left:.6em}
.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;width:100%}
.mode{font-family:inherit;text-align:left;color:#fff;background:rgba(0,0,0,.55);border:2px solid var(--c);border-radius:12px;padding:14px 14px 12px;cursor:pointer;
  box-shadow:0 0 12px var(--g),inset 0 0 18px var(--g);transition:transform .15s,background .15s;touch-action:manipulation}
.mode:hover,.mode.sel{transform:translateY(-3px) scale(1.03);background:rgba(255,255,255,.07);box-shadow:0 0 22px var(--c),inset 0 0 22px var(--g)}
.mode h3{font-size:17px;letter-spacing:.12em;color:var(--c);text-shadow:0 0 10px var(--c)}
.mode p{font-family:system-ui,-apple-system,sans-serif;font-size:12px;line-height:1.38;color:rgba(255,255,255,.74);margin:7px 0 10px;min-height:66px}
.mode .b{font-size:10px;letter-spacing:.12em;color:rgba(255,255,255,.55)}
.mode .b b{color:#ffe640;font-weight:700}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font:700 13px Orbitron,sans-serif;letter-spacing:.14em;color:#fff;background:rgba(0,0,0,.5);border:2px solid var(--c,#3ef0ff);border-radius:10px;padding:12px 20px;cursor:pointer;
  box-shadow:0 0 10px rgba(62,240,255,.45);touch-action:manipulation;transition:background .15s,transform .15s}
.btn:hover,.btn.sel{background:rgba(62,240,255,.18);transform:scale(1.04)}
.btn.small{font-size:11px;padding:8px 12px}
.btn.primary{--c:#ffe640;box-shadow:0 0 14px rgba(255,230,64,.55);color:#ffe640}
.help{font-family:system-ui,-apple-system,sans-serif;font-size:13px;color:rgba(255,255,255,.66);text-align:center;line-height:1.85}
.help kbd{font-family:Orbitron,sans-serif;font-size:10px;border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:1px 6px;color:#fff;white-space:nowrap}
.help b{color:#3ef0ff;font-weight:600}
#rotateHint{font-size:11px;letter-spacing:.2em;color:#ff4fd8;text-shadow:0 0 8px #ff4fd8;text-align:center}
.big{font-weight:900;font-size:clamp(36px,8vw,84px);letter-spacing:.08em;text-align:center;text-shadow:0 0 8px #fff,0 0 26px var(--c,#ff4fd8),0 0 60px var(--c,#ff4fd8)}
.scorebig{font-weight:900;font-size:clamp(34px,7vw,72px);text-shadow:0 0 10px #fff,0 0 30px #3ef0ff}
.newbest{font-size:14px;letter-spacing:.3em;color:#ffe640;text-shadow:0 0 12px #ffb400;animation:blink .7s infinite;min-height:18px}
.stats{display:grid;grid-template-columns:repeat(4,auto);gap:10px 28px;text-align:center}
.stats div{font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.55)}
.stats div b{display:block;font-size:20px;letter-spacing:.05em;color:#fff;margin-top:4px;text-shadow:0 0 10px #3ef0ff}
@media (max-height:540px){
  .title{font-size:clamp(36px,8vw,56px)} .panel{gap:10px} .mode p{display:none} .mode{padding:10px 12px} .mode h3{font-size:14px}
  .help{font-size:11px;line-height:1.6} .big{font-size:40px} .scorebig{font-size:38px}
}
@media (max-width:760px) and (min-height:541px){ .modes{grid-template-columns:1fr 1fr} .mode p{min-height:0} .mode:first-child{grid-column:1/-1} }
@media (max-width:760px) and (max-height:540px){ .modes{grid-template-columns:repeat(5,1fr);gap:6px} .mode{padding:8px} .mode h3{font-size:11px;letter-spacing:.06em} .mode .b{font-size:8px} }
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:.4em;color:#3ef0ff;text-shadow:0 0 10px #3ef0ff;z-index:20;background:#000}
</style>

<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="hud-top">
    <div class="hud-l">
      <button id="pauseBtn" aria-label="Pause">II</button>
      <div class="stack"><div id="lives" class="icons"></div><div id="bombs" class="icons"></div></div>
    </div>
    <div class="hud-c"><div id="score">0</div><div id="mult">×1</div></div>
    <div class="hud-r"><div class="lbl">BEST</div><div id="best">0</div><div id="timer"></div></div>
  </div>
  <div id="powers"></div>
  <div id="zoneHint" class="hidden">ENTER A ZONE TO FIRE</div>
</div>
<div id="announce"></div>

<div id="touch">
  <div class="stick" id="stickL"><div class="knob"></div><div class="lab">MOVE</div></div>
  <div class="stick" id="stickR"><div class="knob"></div><div class="lab">AIM + FIRE</div></div>
  <button id="bombBtn">BOMB<br><span id="bombCount">3</span></button>
</div>

<div id="menu" class="screen">
  <div class="panel">
    <div>
      <div class="title">GEO <span>WARS</span></div>
      <div class="sub" style="margin-top:10px">NEON EVOLVED</div>
    </div>
    <div class="modes" id="modes"></div>
    <div class="help" id="help"></div>
    <div id="rotateHint" class="hidden">↻ ROTATE TO LANDSCAPE FOR THE BEST EXPERIENCE</div>
    <div class="btnrow">
      <button class="btn small" data-f id="musicBtn">MUSIC: ON</button>
      <button class="btn small" data-f id="sfxBtn">SFX: ON</button>
      <button class="btn small" data-f id="fsBtn">FULLSCREEN</button>
    </div>
  </div>
</div>

<div id="pause" class="screen hidden">
  <div class="panel">
    <div class="big" style="--c:#3ef0ff">PAUSED</div>
    <div class="btnrow" style="flex-direction:column;align-items:stretch;min-width:240px">
      <button class="btn primary" data-f id="resumeBtn">RESUME</button>
      <button class="btn" data-f id="restartBtn">RESTART</button>
      <button class="btn" data-f id="quitBtn">MAIN MENU</button>
    </div>
    <div class="btnrow">
      <button class="btn small" data-f id="musicBtn2">MUSIC: ON</button>
      <button class="btn small" data-f id="sfxBtn2">SFX: ON</button>
    </div>
  </div>
</div>

<div id="over" class="screen hidden">
  <div class="panel">
    <div class="big" id="overTitle">GAME OVER</div>
    <div class="sub" id="overMode"></div>
    <div class="scorebig" id="overScore">0</div>
    <div class="newbest" id="overBest"></div>
    <div class="stats" id="overStats"></div>
    <div class="btnrow">
      <button class="btn primary" data-f id="againBtn">PLAY AGAIN</button>
      <button class="btn" data-f id="menuBtn">MAIN MENU</button>
    </div>
  </div>
</div>

<div id="loading">LOADING</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// =====================================================================
//  CONFIG & UTILS
// =====================================================================
const $ = s => document.querySelector(s);
const IS_TOUCH = matchMedia('(pointer: coarse)').matches;
const LOW = IS_TOUCH || (navigator.hardwareConcurrency || 8) <= 4;
const AW = 34, AH = 21;                 // arena half extents (world units)
const MAXE = LOW ? 170 : 260;           // enemy cap
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const angleLerp = (a, b, t) => { let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI; return a + d * t; };
const fmt = n => Math.floor(n).toLocaleString('en-US');
const getLS = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } };
const setLS = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const hexToRgba = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
function pickW(list) { let s = 0; for (const [, w] of list) s += w; let r = Math.random() * s; for (const [k, w] of list) { r -= w; if (r <= 0 && w > 0) return k; } return list[0][0]; }

// =====================================================================
//  RENDERER / POST FX
// =====================================================================
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', alpha: false, stencil: false });
let pixelRatio = Math.min(devicePixelRatio || 1, LOW ? 1.5 : 2);
renderer.setPixelRatio(pixelRatio);
renderer.setClearColor(0x000000, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.5, 400);
const rt = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, samples: LOW ? 0 : 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.95, 0.42, 0.16);
composer.addPass(bloom);
const fxPass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uAberr: { value: 0.0015 }, uFlash: { value: 0 }, uVig: { value: 1.1 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uAberr, uFlash, uVig; varying vec2 vUv;
    void main(){
      vec2 c = vUv - 0.5; float d = dot(c,c);
      vec2 off = c * uAberr * (1.0 + d * 4.0);
      vec3 col = vec3(texture2D(tDiffuse, vUv + off).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - off).b);
      col *= 1.0 - d * uVig;
      col += uFlash * vec3(0.85, 0.92, 1.0);
      gl_FragColor = vec4(col, 1.0);
    }`
});
composer.addPass(fxPass);
composer.addPass(new OutputPass());

let viewH = 34, camZ = 40;
function resize() {
  const w = innerWidth, h = innerHeight;
  if (w < 2 || h < 2) return;
  renderer.setSize(w, h, false);
  composer.setPixelRatio(pixelRatio);
  composer.setSize(w, h);
  camera.aspect = w / h;
  const minW = LOW ? 25 : 32;
  viewH = LOW ? 27 : 34;
  if (viewH * camera.aspect < minW) viewH = minW / camera.aspect;
  camZ = (viewH / 2) / Math.tan(camera.fov * DEG / 2);
  camera.updateProjectionMatrix();
  $('#rotateHint').classList.toggle('hidden', !(IS_TOUCH && h > w));
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));

// =====================================================================
//  GEOMETRY HELPERS (thick neon vector lines)
// =====================================================================
function lineGeo(polys, w) {
  const v = [], hw = w / 2;
  for (const poly of polys) {
    const pts = poly.pts, n = pts.length, segs = poly.closed === false ? n - 1 : n;
    for (let i = 0; i < segs; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % n];
      let dx = bx - ax, dy = by - ay; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
      const nx = -dy * hw, ny = dx * hw;
      const x0 = ax - dx * hw, y0 = ay - dy * hw, x1 = bx + dx * hw, y1 = by + dy * hw;
      v.push(x0 + nx, y0 + ny, 0, x0 - nx, y0 - ny, 0, x1 + nx, y1 + ny, 0, x1 + nx, y1 + ny, 0, x0 - nx, y0 - ny, 0, x1 - nx, y1 - ny, 0);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  g.computeBoundingSphere();
  return g;
}
const circlePts = (r, n, ph = 0) => Array.from({ length: n }, (_, i) => [Math.cos(ph + i / n * TAU) * r, Math.sin(ph + i / n * TAU) * r]);
const rot = ([x, y], a) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];
const neon = (hex, k = 1.8) => new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(k), side: THREE.DoubleSide });
const neonT = (hex, k = 1.8) => new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(k), side: THREE.DoubleSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });

const SH = {
  player: lineGeo([{ pts: [[0.95, 0.45], [-0.7, 0.85], [-0.3, 0], [-0.7, -0.85], [0.95, -0.45], [0.1, -0.2], [0.1, 0.2]] }], 0.14),
  wanderer: lineGeo([0, 1, 2, 3].map(i => ({ pts: [[0, 0], rot([1, 0], i * TAU / 4), rot([0.62, 0.62], i * TAU / 4)] })), 0.11),
  grunt: lineGeo([{ pts: [[1, 0], [0, 1], [-1, 0], [0, -1]] }, { pts: [[.42, 0], [0, .42], [-.42, 0], [0, -.42]] }], 0.12),
  weaver: lineGeo([{ pts: [[.8, .8], [-.8, .8], [-.8, -.8], [.8, -.8]] }, { pts: [[.8, 0], [0, .8], [-.8, 0], [0, -.8]] }], 0.12),
  spinner: lineGeo([{ pts: [[.72, .72], [-.72, .72], [-.72, -.72], [.72, -.72]] }, { pts: [[1.02, 0], [0, 1.02], [-1.02, 0], [0, -1.02]] }], 0.1),

function tick(rdt) {
  pollGamepad(rdt);
  if (state === 'paused') return;   // freeze & save battery
  let dt = rdt;
  if (state === 'playing') {
    if (G.slowT > 0) G.slowT -= rdt;
    dt = rdt * (G.slowT > 0 ? 0.28 + 0.72 * (1 - G.slowT / 1.3) : 1);
    updateGame(dt, rdt);
  } else {
    if (state === 'menu') updateAttract(rdt);
    hashBuild(); updateEnemies(rdt); compactEnemies();
    wells = [];
  }
  updateBlasts(dt);
  updateParticles(dt);
  gridAcc += dt; let n = 0;
  while (gridAcc >= 1 / 60 && n < 3) { Grid.step(); gridAcc -= 1 / 60; n++; }
  if (n === 3) gridAcc = 0;
  updateCamera(rdt);
  Grid.render(G ? G.M.hue : (cam.t * 0.02) % 1, rdt);
  syncEnemyMeshes(); syncBullets(); syncGeoms(); syncPlayer(rdt);
  borderMat.color.setRGB(0.6, 1.0, 2.6).multiplyScalar(1 + shake * 0.4);
  composer.render(rdt);
  // adaptive resolution if the device struggles
  perfAcc += rdt; perfN++; perfCool -= rdt;
  if (perfN >= 90) {
    const avg = perfAcc / perfN; perfAcc = 0; perfN = 0;
    if (avg > 0.024 && pixelRatio > 0.7 && perfCool <= 0) { pixelRatio = Math.max(0.7, pixelRatio * 0.85); resize(); perfCool = 3; }
  }
}

// =====================================================================
//  BOOT
// =====================================================================
resize();
buildModes(); buildHelp(); syncAudioBtns(); ghostSticks();
document.body.classList.toggle('touch', lastInput === 'touch');
setState('menu');
$('#loading').remove();
requestAnimationFrame(t => { last = t; frame(t); });
window.__gw = { sim(sec) { for (let i = 0; i < sec * 60; i++) tick(1 / 60); }, get state() { return state; }, get G() { return G; }, enemies, bullets, geoms, gates, player, startGame, spawnEnemy };
</script>
